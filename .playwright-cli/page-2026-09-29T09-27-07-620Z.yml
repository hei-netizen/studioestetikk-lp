        - paragraph [ref=f1e278]: En svært dyktig behandler med øye for detaljer. Ina er perfeksjonist og dette kommer tydelig frem i behandlingene hun utfører. Hun forklarer godt, er nøyaktig og opptatt av et naturlig resultat. Jeg følte meg ivaretatt på alle måter og kan varmt anbefale henne videre. Jeg kommer garantert tilbake.
