        - heading "«Anbefales på det sterkeste»" [level=4] [ref=f1e289]
        - paragraph [ref=f1e290]: Ina er utrolig dyktig! Hun er veldig opptatt av at man har det bra under hele behandlingen. På toppen av det hele er hun en perfeksjonist, noe som jeg mener er på sin plass med tanke på resultatet man ønsker å oppnå. Jeg vil si meg utrolig godt fornøyd med behandlingen jeg utførte hos Ina.
