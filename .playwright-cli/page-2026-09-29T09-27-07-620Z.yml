        - heading "«For deg som ønsker det beste»" [level=4] [ref=f1e283]
        - paragraph [ref=f1e284]: Jeg kan ikke annet enn å anbefale Ina og Studio Estetikk på det varmeste. Jeg som mann som bryr meg om estetikk føler meg komfortabel og godt informert hver gang vi møtes. Det er også mange andre menn som er kunder her og det føles trygt. Dette er ikke et sted for rask & hurtig, dette er for deg som bryr deg om resultat over tid.
      - generic [ref=f1e285]:
